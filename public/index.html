<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0F1626">
<title>Ladder</title>
<meta name="description" content="Pick a topic, climb from easy to expert, best answers win.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1626; --panel: #172038; --panel2: #1D2846; --line: #2A3552; --ink: #EEF2FF; --muted: #8A96B8; --dim: #55617F;
    --gold: #F7B32B; --gold-ink: #221A05; --blue: #3D7BFF; --green: #2ED28A; --red: #FF4D5E;
    --hud: 52px; --dock: 72px; --pad: 14px;
    --c0: #F7B32B; --c1: #3D7BFF; --c2: #2ED28A; --c3: #FF4D5E; --c4: #B36BFF; --c5: #FF8A3D; --c6: #2BC8E8; --c7: #F25DA8; --c8: #9BE15D; --c9: #FFD166; --c10: #6C8CFF; --c11: #FF6B8B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 Barlow, system-ui, sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, .hd, .num { font-family: "Barlow Semi Condensed", Barlow, sans-serif; letter-spacing: .01em; }
  h1 { font-size: 44px; font-weight: 800; line-height: 1; margin: 0; }
  h2 { font-size: 22px; font-weight: 700; margin: 0; line-height: 1.15; }
  p { margin: 0; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }
  .hidden { display: none !important; }
  a { color: var(--blue); }

  /* ---------- shell ---------- */
  .app { position: fixed; inset: 0; display: grid; grid-template-rows: var(--hud) 3px 1fr var(--dock); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .hud { display: flex; align-items: center; gap: 10px; padding: 0 var(--pad); background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
  .hud .brand { font: 800 20px "Barlow Semi Condensed", system-ui, sans-serif; letter-spacing: .04em; color: var(--gold); }
  .hud .mid { flex: 1; min-width: 0; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 13.5px; }
  .hud .clock { font: 800 30px/1 "Barlow Semi Condensed", system-ui, sans-serif; min-width: 44px; text-align: right; color: var(--gold); }
  .hud .clock.warn { color: var(--red); }
  .hud .ib { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .hud .ib:hover { color: var(--ink); background: var(--panel2); }
  .hud .ib svg { width: 18px; height: 18px; }
  .tbar { background: var(--line); }
  .tbar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .95s linear, background .3s; }
  .tbar i.warn { background: var(--red); }
  .stage { min-height: 0; display: flex; padding: var(--pad); gap: 12px; overflow: hidden; }
  .stage > .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .stage > .main.narrow { max-width: 560px; margin: 0 auto; width: 100%; }
  .stage > .side { width: 300px; min-height: 0; display: none; flex-direction: column; gap: 10px; }
  @media (min-width: 900px) { .stage > .side { display: flex; } .stage { padding: 18px; gap: 18px; } }
  .dock { display: flex; align-items: center; gap: 10px; padding: 0 var(--pad); border-top: 1px solid var(--line); background: var(--panel); }
  .dock .note { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- ladder rail ---------- */
  .rail { width: 22px; flex: none; display: flex; flex-direction: column-reverse; gap: 4px; padding: 6px 0; }
  .rail i { flex: 1; border-radius: 2px; background: var(--line); position: relative; }
  .rail i.done { background: var(--dim); }
  .rail i.cur { background: var(--gold); box-shadow: 0 0 14px rgba(247,179,43,.6); }
  .rail i.cur::after { content: ""; position: absolute; left: 100%; top: 50%; margin-left: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); transform: translateY(-50%); }

  /* ---------- panels, buttons, inputs ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 0; }
  .panel.fill { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--gold); color: var(--gold-ink); font: 700 16px "Barlow Semi Condensed", system-ui, sans-serif; letter-spacing: .03em; cursor: pointer; white-space: nowrap; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.blue { background: var(--blue); color: #fff; }
  .btn.red { background: transparent; color: var(--red); border: 1px solid rgba(255,77,94,.4); }
  .btn.wide { width: 100%; }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 14px; }
  input[type=text], textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; border-color: transparent; }
  textarea { resize: none; flex: 1; min-height: 80px; line-height: 1.45; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  .err { color: var(--red); font-size: 13px; min-height: 16px; }
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--muted); font: 600 14px "Barlow Semi Condensed", system-ui, sans-serif; letter-spacing: .03em; height: 34px; border-radius: 8px; cursor: pointer; }
  .seg button.on { background: var(--panel2); color: var(--ink); }
  .step { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); height: 40px; }
  .step button { width: 40px; height: 100%; border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; }
  .step output { flex: 1; text-align: center; font: 700 18px "Barlow Semi Condensed", system-ui, sans-serif; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; height: 40px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 10px; font: 700 15px "Barlow Semi Condensed", system-ui, sans-serif; letter-spacing: .04em; cursor: pointer; }
  .tabs button.on { background: var(--panel2); color: var(--ink); border-color: var(--panel2); }

  /* ---------- avatars & players ---------- */
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 13px "Barlow Semi Condensed", system-ui, sans-serif; letter-spacing: .04em; color: #0B0F1A; flex: none; position: relative; }
  .av.lg { width: 52px; height: 52px; font-size: 18px; }
  .av.sm { width: 28px; height: 28px; font-size: 11px; }
  .av.away { opacity: .35; }
  .av .ring { position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; }
  .av .ring.typing { border-color: var(--blue); animation: pulse 1s infinite; }
  .av .ring.done { border-color: var(--green); }
  @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  .pgrid { display: flex; flex-wrap: wrap; gap: 12px 10px; align-content: flex-start; overflow: hidden; }
  .pcell { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 64px; }
  .pcell .nm { font-size: 11.5px; color: var(--muted); max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcell .nm.me { color: var(--ink); font-weight: 600; }
  .pcell .st { font-size: 10px; color: var(--dim); height: 12px; }
  .pcell .st.done { color: var(--green); } .pcell .st.typing { color: var(--blue); }
  .strip { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- question & answer ---------- */
  .qhead { display: flex; align-items: baseline; gap: 10px; }
  .rung { font: 800 13px "Barlow Semi Condensed", system-ui, sans-serif; letter-spacing: .08em; color: var(--gold); }
  .mult { margin-left: auto; font: 700 13px "Barlow Semi Condensed", system-ui, sans-serif; color: var(--muted); }
  .q { font: 700 clamp(20px, 3.4vh, 28px)/1.2 "Barlow Semi Condensed", system-ui, sans-serif; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .locked { border: 1px solid rgba(46,210,138,.45); background: rgba(46,210,138,.08); border-radius: 12px; padding: 12px; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .locked .txt { color: var(--muted); font-size: 14px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
  .count { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15,22,38,.86); border-radius: 12px; z-index: 2; }
  .count b { font: 800 96px/1 "Barlow Semi Condensed", system-ui, sans-serif; color: var(--gold); }
  .count span { display: block; text-align: center; color: var(--muted); margin-top: 6px; }
  .relwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }

  /* ---------- lists ---------- */
  .list { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: auto; scrollbar-width: none; }
  .list::-webkit-scrollbar { display: none; }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); min-height: 44px; cursor: default; }
  .row.me { border-color: rgba(247,179,43,.55); }
  .row.top { background: linear-gradient(90deg, rgba(247,179,43,.16), var(--bg)); border-color: rgba(247,179,43,.5); }
  .row.click { cursor: pointer; } .row.click:hover { background: var(--panel2); }
  .row .rk { width: 20px; font: 800 15px "Barlow Semi Condensed", system-ui, sans-serif; color: var(--muted); text-align: center; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .row .nm small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
  .row .cov { width: 64px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .row .cov i { display: block; height: 100%; background: var(--green); }
  .row .cov i.mid { background: var(--gold); } .row .cov i.low { background: var(--red); }
  .row .pt { font: 800 18px "Barlow Semi Condensed", system-ui, sans-serif; color: var(--gold); min-width: 46px; text-align: right; }
  .row .pt.zero { color: var(--dim); }
  .row .streak { font: 700 12px "Barlow Semi Condensed", system-ui, sans-serif; color: var(--gold); }
  .row .delta { font-size: 11px; font-weight: 600; } .delta.up { color: var(--green); } .delta.down { color: var(--red); }
  .crown { width: 16px; height: 16px; color: var(--gold); }

  /* ---------- reveal detail / sheet ---------- */
  .sheet-bg { position: fixed; inset: 0; background: rgba(5,8,16,.6); z-index: 20; display: none; }
  .sheet-bg.on { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; background: var(--panel); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; z-index: 21; transform: translateY(105%); transition: transform .25s ease; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  .sheet.on { transform: none; }
  @media (min-width: 900px) { .sheet { left: 50%; right: auto; width: 640px; transform: translate(-50%, 105%); } .sheet.on { transform: translate(-50%, 0); } }
  .sheet .sh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sheet .sh h2 { flex: 1; font-size: 18px; }
  .sheet .sb { padding: 14px 16px; overflow: auto; min-height: 0; }
  .sheet .sf { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .tick { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; padding: 5px 0; border-top: 1px solid var(--line); }
  .tick:first-child { border-top: 0; }
  .tick b { flex: none; width: 18px; text-align: center; font-weight: 800; }
  .tick.pass b { color: var(--green); } .tick.part b { color: var(--gold); } .tick.miss b { color: var(--red); }
  .tick .p { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font: 600 12px Barlow; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .tag.good { color: var(--green); } .tag.bad { color: var(--red); } .tag.gold { color: var(--gold); }
  .anstext { white-space: pre-wrap; line-height: 1.5; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }

  /* ---------- home / lobby / misc ---------- */
  .code { font: 800 clamp(48px, 14vw, 84px)/1 "Barlow Semi Condensed", system-ui, sans-serif; letter-spacing: .16em; color: var(--gold); text-align: center; padding-left: .16em; }
  .center { text-align: center; }
  .steps { display: flex; gap: 5px; }
  .steps i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); animation: glow 1.3s infinite; }
  @keyframes glow { 0%, 100% { background: var(--line) } 50% { background: var(--gold) } }
  .podium { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; align-items: end; }
  .pod { text-align: center; border-radius: 12px 12px 4px 4px; background: var(--bg); border: 1px solid var(--line); padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pod .sc { font: 800 22px "Barlow Semi Condensed", system-ui, sans-serif; color: var(--gold); }
  .pod .nm { font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pod.p1 { border-color: rgba(247,179,43,.6); background: linear-gradient(180deg, rgba(247,179,43,.16), var(--bg)); padding-top: 18px; }
  .pod .place { font: 700 12px "Barlow Semi Condensed", system-ui, sans-serif; color: var(--muted); letter-spacing: .06em; }
  .lanes { display: flex; flex-direction: column; gap: 6px; }
  .lane { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .lane .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .lane .bar i { display: block; height: 100%; background: var(--blue); transition: width .4s; }
  .lane .bar i.me { background: var(--gold); }
  .toasts { position: fixed; top: calc(var(--hud) + 10px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 30; pointer-events: none; width: min(92vw, 420px); }
  .toast { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: in .2s ease; }
  .toast.bad { border-color: rgba(255,77,94,.5); }
  @keyframes in { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 15; }
  .confetti i { position: absolute; top: -12px; width: 7px; height: 12px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .5 } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001s !important; transition-duration: .001s !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud" id="hud"></header>
  <div class="tbar"><i id="tfill"></i></div>
  <main class="stage" id="stage"></main>
  <footer class="dock" id="dock"></footer>
</div>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="toasts" id="toasts"></div>
<div class="confetti" id="confetti"></div>

<script>
// ============ helpers ============
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ini = (n) => { const w = String(n || "?").trim().split(/\s+/); return ((w[0]?.[0] || "") + (w[1]?.[0] || w[0]?.[1] || "")).toUpperCase(); };
const av = (p, cls = "", ring = "") => `<span class="av ${cls} ${p.away ? "away" : ""}" style="background:var(--c${(p.avatar ?? 0) % 12})">${ini(p.name)}${ring ? `<i class="ring ${ring}"></i>` : ""}</span>`;
const lvl = (p) => p >= 0.7 ? "pass" : p >= 0.4 ? "part" : "miss";
const pct = (p) => Math.round((p || 0) * 100) + "%";
const modeName = { timed: "Timed", untimed: "Untimed", race: "Race" };
const ICON = {
  sound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
  mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  crown: '<svg class="crown" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="m5 12 5 5L20 7"/></svg>',
};

let session = null; try { session = JSON.parse(localStorage.getItem("ladder:session") || "null"); } catch {}
try { const u = new URLSearchParams(location.search); if (u.get("s")) { session = JSON.parse(atob(u.get("s"))); localStorage.setItem("ladder:session", JSON.stringify(session)); history.replaceState(null, "", `?room=${session.code}`); } } catch {}
let state = null, timeOffset = 0, pollTimer = null, lastScreen = "", renderedRound = -1, lastRanks = {}, lastEventT = null, lastTyping = 0, tickAt = 0;
const serverNow = () => Date.now() + timeOffset;
const post = async (action, body) => {
  const r = await fetch(`/api/room/${action}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
};
const saveSession = (s) => { session = s; try { localStorage.setItem("ladder:session", JSON.stringify(s)); } catch {} };
const clearSession = () => { session = null; try { localStorage.removeItem("ladder:session"); } catch {} };
function toast(msg, bad) { const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; $("#toasts").appendChild(t); setTimeout(() => t.remove(), 2600); }

// ============ sound (synthesised, no files) ============
const snd = (() => {
  let ctx = null, muted = false; try { muted = localStorage.getItem("ladder:muted") === "1"; } catch {}
  const ensure = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; };
  const tone = (f, t0, dur, type = "sine", g = 0.18, slide = 0) => { const c = ensure(); if (!c || muted) return; const o = c.createOscillator(), a = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + t0 + dur); a.gain.setValueAtTime(0, c.currentTime + t0); a.gain.linearRampToValueAtTime(g, c.currentTime + t0 + 0.01); a.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur); o.connect(a).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05); };
  return {
    unlock: ensure,
    get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem("ladder:muted", muted ? "1" : "0"); } catch {} if (!muted) this.click(); return muted; },
    tick() { tone(1100, 0, 0.06, "square", 0.05); },
    count() { tone(660, 0, 0.12, "triangle", 0.15); },
    go() { tone(880, 0, 0.18, "triangle", 0.18); tone(1320, 0.08, 0.25, "triangle", 0.14); },
    click() { tone(520, 0, 0.05, "square", 0.08); tone(780, 0.04, 0.07, "square", 0.06); },
    lock() { tone(440, 0, 0.08, "triangle", 0.15); tone(660, 0.07, 0.12, "triangle", 0.15); tone(880, 0.14, 0.2, "triangle", 0.12); },
    reveal() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.07, 0.22, "triangle", 0.14)); },
    thud() { tone(160, 0, 0.25, "sine", 0.25, 60); },
    join() { tone(700, 0, 0.08, "sine", 0.1); tone(1000, 0.06, 0.1, "sine", 0.08); },
    leave() { tone(500, 0, 0.1, "sine", 0.1); tone(330, 0.08, 0.16, "sine", 0.08); },

}
function leaveLocal() { closeSheet(); clearSession(); stopPolling(); history.replaceState(null, "", "/"); lastScreen = ""; state = null; renderHome(); }

// ============ polling ============
async function poll() {
  if (!session) return;
  clearTimeout(pollTimer);
  try {
    const s = await post("state", session);
    timeOffset = s.serverTime - Date.now();
    handleEvents(s); state = s; render();
  } catch (e) {
    if (/not found|Not a player/i.test(e.message)) { toast(e.message, true); leaveLocal(); return; }
  }
  const fast = state && ["playing", "generating"].includes(state.status);
  pollTimer = setTimeout(poll, fast ? 1000 : 1800);
}
function startPolling() { stopPolling(); poll(); }
function stopPolling() { clearTimeout(pollTimer); pollTimer = null; }
function handleEvents(s) {
  if (lastEventT == null) { lastEventT = s.serverTime; return; }
  for (const e of s.events || []) {
    if (e.t <= lastEventT || e.playerId === s.me.id) continue;
    toast(e.text, e.type === "kick" || e.type === "end");
    if (e.type === "join") snd.join(); else if (e.type === "leave" || e.type === "kick") snd.leave(); else snd.click();
  }
  lastEventT = s.serverTime;
}

// ============ screens ============
function render() {
  const s = state;
  const screen = s.status + ":" + s.mode + ":" + (s.isHost ? "h" : "p");
  if (screen !== lastScreen) { lastScreen = screen; renderedRound = -1; closeSheet(); }
  if (s.status === "lobby") return renderLobby();
  if (s.status === "generating") return renderGenerating();
  if (s.status === "finished") return renderFinished();
  if (s.mode === "race") return renderRace();
  if (s.status === "playing") return renderPlaying();
  if (s.status === "reveal") return renderReveal();
}

// ---- playing (timed / untimed) ----
function renderPlaying() {
  const s = state, q = s.question, n = q.total;
  const mult = (1 + (q.difficulty - 1) / Math.max(1, n - 1)).toFixed(1);
  const inCount = s.mode === "timed" && serverNow() < s.round.startedAt + s.countdownMs;
  if (renderedRound !== q.index) {
    renderedRound = q.index; tickAt = 0;
    shell({
      hud: `Rung ${q.index + 1} of ${n}`, clock: s.mode === "timed" ? "" : null,
      rail: `<div class="rail">${Array.from({ length: n }, (_, k) => `<i class="${k < q.index ? "done" : k === q.index ? "cur" : ""}"></i>`).join("")}</div>`,
      stage: `<div class="panel fill" style="gap:8px">
          <div class="qhead"><span class="rung">${esc(q.label).toUpperCase()}</span><span class="mult">×${mult} points</span></div>
          <p class="q">${esc(q.prompt)}</p>
          <div class="relwrap">
            ${inCount ? `<div class="count" id="count"><div><b id="countn">3</b><span>Get ready</span></div></div>` : ""}
            <textarea id="ans" placeholder="Explain in your own words. Be specific." ${inCount ? "disabled" : ""}></textarea>
            <div class="locked hidden" id="lockedbox"></div>
          </div>
          <div class="strip" id="pl"></div>
        </div>`,
      side: `<div class="panel fill"><div class="qhead"><h2>Standings</h2></div><div class="list" id="lb"></div></div>`,
      dock: `<span class="note" id="note">${s.mode === "timed" ? "Speed counts" : "Reveals when everyone has answered"}</span>${s.mode === "untimed" && s.isHost ? `<button class="btn ghost sm" id="force">Reveal now</button>` : ""}<button class="btn" id="submit" ${inCount ? "disabled" : ""}>Lock in</button>`,
    });
    const ta = $("#ans");
    ta.oninput = () => { const t = Date.now(); if (t - lastTyping > 1800) { lastTyping = t; post("typing", { ...session, q: q.index }).catch(() => {}); } };
    ta.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submit(); });
    $("#submit").onclick = submit;
    if ($("#force")) $("#force").onclick = () => post("next", session).then(poll).catch((e) => toast(e.message, true));
    async function submit() {
      const text = ta.value.trim(); if (text.length < 5) { toast("Write a bit more first", true); return; }
      $("#submit").disabled = true; $("#submit").textContent = "Locking";
      try { await post("answer", { ...session, q: q.index, text }); snd.lock(); showLocked(text); poll(); }
      catch (e) { toast(e.message, true); $("#submit").disabled = false; $("#submit").textContent = "Lock in"; }
    }
    if (!inCount) setTimeout(() => ta.focus(), 30);
  }
  if (s.myAnswer && !$("#lockedbox").classList.contains("shown")) showLocked(s.myAnswer.text);
  const waiting = s.players.filter((p) => !p.submitted && !p.away).length;

  if ($("#lb")) $("#lb").innerHTML = standings(s.players, false);

    box.innerHTML = `<div style="display:flex;align-items:center;gap:8px;color:var(--green);font-weight:600">${ICON.check} Locked in</div><div class="txt">${esc(text)}</div><p class="tiny muted" style="margin-top:auto">Jev grades every answer the moment the round closes.</p>`;
  }
}
function tickTimer() {
  const s = state; if (!s.round?.endsAt || s.status !== "playing") return;
  const now = serverNow(), start = s.round.startedAt + s.countdownMs, total = s.secondsPerQ * 1000;
  const cEl = $("#count");
  if (now < start) {
    const left = Math.ceil((start - now) / 1000);
    if (cEl) { const nEl = $("#countn"); if (nEl.textContent != left) { nEl.textContent = left; snd.count(); } }
    setBar(1, false); if ($("#clock")) $("#clock").textContent = s.secondsPerQ;
    setTimeout(tickTimer, 100); return;
  }
  if (cEl) { cEl.remove(); const ta = $("#ans"); if (ta) { ta.disabled = false; ta.focus(); } if ($("#submit")) $("#submit").disabled = false; snd.go(); }
  const left = Math.max(0, s.round.endsAt - now), secs = Math.ceil(left / 1000);
  if ($("#clock")) { $("#clock").textContent = secs; $("#clock").classList.toggle("warn", left < 10000); }
  setBar(left / total, left < 10000);
  if (left <= 5000 && left > 0 && secs !== tickAt && !s.myAnswer) { tickAt = secs; snd.tick(); }
  if (left > 0) setTimeout(tickTimer, 250);
  else { if ($("#submit") && !$("#submit").disabled) { $("#submit").disabled = true; $("#submit").textContent = "Time's up"; snd.timeup(); } if ($("#note")) $("#note").textContent = "Grading"; }
}

// ---- reveal ----
function standings(players, delta) {
  return players.map((p) => { const prev = lastRanks[p.id]; const d = delta && prev && prev !== p.rank ? `<span class="delta ${prev > p.rank ? "up" : "down"}">${prev > p.rank ? "▲" : "▼"}${Math.abs(prev - p.rank)}</span>` : "";
    return `<div class="row ${p.isMe ? "me" : ""}"><span class="rk">${p.rank}</span>${av(p, "sm")}<span class="nm">${esc(p.name)}${p.away ? "<small>away</small>" : ""}</span>${p.streak >= 2 ? `<span class="streak">×${p.streak} streak</span>` : ""}${d}<span class="pt ${p.score ? "" : "zero"}">${p.score}</span></div>`; }).join("");
}
function answerRow(a, i, opts = {}) {
  const top = i === 0 && a.points > 0;
  const c = a.coverage || 0;
  return `<div class="row click ${a.playerId === state.me.id ? "me" : ""} ${top ? "top" : ""}" data-ans="${i}"><span class="rk">${top ? ICON.crown : i + 1}</span>${av(a, "sm")}<span class="nm">${esc(a.name)}<small>${a.skipped ? "No answer" : a.flawless ? "Flawless" : a.misFired ? "Misconception" : Math.round(c * 100) + "% covered"}</small></span><span class="cov"><i class="${lvl(c)}" style="width:${pct(c)}"></i></span><span class="pt ${a.points ? "" : "zero"}">${a.skipped ? "0" : "+" + a.points}</span></div>`;
}
function answerDetail(a, rubric, refPoints) {
  const crit = (a.criteria || rubric.map((text) => ({ text, p: 0 }))).map((c) => `<div class="tick ${lvl(c.p)}"><b>${lvl(c.p) === "pass" ? "✓" : lvl(c.p) === "part" ? "~" : "✗"}</b><span>${esc(c.text)}</span><span class="p">${pct(c.p)}</span></div>`).join("");
  const mis = (a.misconceptions || []).filter((m) => m.p >= 0.5).map((m) => `<div class="tick miss"><b>!</b><span>Misconception: ${esc(m.text)}</span><span class="p">${pct(m.p)}</span></div>`).join("");
  const b = a.breakdown || {};
  const tags = a.skipped ? "" : `<div class="tags">${b.mult ? `<span class="tag">×${b.mult} rung</span>` : ""}${b.speed ? `<span class="tag good">+${b.speed} speed</span>` : ""}${b.streak ? `<span class="tag gold">+${b.streak} streak</span>` : ""}${a.misFired ? `<span class="tag bad">½ misconception</span>` : ""}${a.flawless ? `<span class="tag gold">flawless</span>` : ""}${a.ms ? `<span class="tag">${(a.ms / 1000).toFixed(1)}s</span>` : ""}</div>`;
  return `<div class="anstext ${a.skipped ? "muted" : ""}">${a.skipped ? "Did not answer in time." : esc(a.text)}</div>${a.skipped ? "" : crit + mis}${a.error ? `<p class="err">Grading failed: ${esc(a.error)}</p>` : ""}${tags}
    ${refPoints ? `<details style="margin-top:12px"><summary class="small muted" style="cursor:pointer">What a full answer covers</summary><ul class="small" style="margin:6px 0 0 18px;padding:0">${refPoints.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></details>` : ""}`;
}
function renderReveal() {
  const s = state, q = s.question, r = s.reveal;
  if (renderedRound === q.index) { if ($("#lb")) $("#lb").innerHTML = standings(s.players, true); revealNote(); return; }
  renderedRound = q.index;
  const mine = r.answers.find((a) => a.playerId === s.me.id);
  if (mine?.skipped) snd.thud(); else snd.reveal();
  const winner = r.answers[0]?.points > 0 ? r.answers[0] : null;
  shell({
    hud: `Rung ${q.index + 1} of ${q.total}`,
    rail: `<div class="rail">${Array.from({ length: q.total }, (_, k) => `<i class="${k <= q.index ? "done" : ""}"></i>`).join("")}</div>`,
    stage: `<div class="panel fill" style="gap:8px">
        <div class="qhead"><span class="rung">${winner ? `${esc(winner.name).toUpperCase()} TAKES THE RUNG` : "NOBODY SCORED"}</span><button class="btn ghost sm" id="stand" style="margin-left:auto">Standings</button></div>
        <p class="q" style="font-size:18px;-webkit-line-clamp:2">${esc(q.prompt)}</p>
        <div class="list" id="answers">${r.answers.map((a, i) => answerRow(a, i)).join("")}</div>
        <p class="tiny muted">Tap an answer to see the rubric.</p>
      </div>`,
    side: `<div class="panel fill"><div class="qhead"><h2>Standings</h2></div><div class="list" id="lb">${standings(s.players, true)}</div></div>`,
    dock: `<span class="note" id="note"></span>${s.isHost ? `<button class="btn" id="next">${q.index + 1 >= q.total ? "Final results" : "Next rung"}</button>` : ""}`,
  });
  lastRanks = Object.fromEntries(s.players.map((p) => [p.id, p.rank]));
  $("#answers").querySelectorAll("[data-ans]").forEach((row) => row.onclick = () => { const a = r.answers[Number(row.dataset.ans)]; snd.click(); openSheet(`${a.name}: ${a.skipped ? "0" : "+" + a.points}`, answerDetail(a, r.rubric, r.points)); });
  $("#stand").onclick = () => openSheet("Standings", `<div class="list">${standings(s.players, true)}</div>`);
  if ($("#next")) $("#next").onclick = () => { $("#next").disabled = true; snd.click(); post("next", session).then(poll).catch((e) => { toast(e.message, true); $("#next").disabled = false; }); };
  revealNote();
}
function revealNote() {
  const s = state; const el = $("#note"); if (!el) return;
  if (s.revealAutoMs && s.round?.revealedAt) { const left = Math.max(0, Math.ceil((s.round.revealedAt + s.revealAutoMs - serverNow()) / 1000)); el.textContent = (s.isHost ? "Auto-advances in " : "Next rung in ") + left + "s"; if (left > 0 && s.status === "reveal") setTimeout(revealNote, 500); }
  else el.textContent = s.isHost ? "" : "Host advances to the next rung";
}

// ---- race ----
function renderRace() {
  const s = state, n = s.totalQuestions;
  const lanes = `<div class="lanes">${s.players.map((p) => `<div class="lane">${av(p, "sm", p.typing ? "typing" : "")}<span style="min-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><div class="bar"><i class="${p.isMe ? "me" : ""}" style="width:${Math.min(100, (p.progress / n) * 100)}%"></i></div><span class="muted tiny" style="min-width:36px;text-align:right">${Math.min(p.progress, n)}/${n}</span></div>`).join("")}</div>`;
  if (s.finishedMine) {
    if (renderedRound !== 999) { renderedRound = 999; shell({ hud: esc(s.topic), stage: `<div class="panel fill" style="gap:10px"><h2>You reached the top</h2><p class="muted small">Waiting for the others to finish.</p><div id="track"></div><div class="list" id="lb"></div></div>`, dock: `<span class="note">Final results once everyone is done</span>` }); }
    $("#track").innerHTML = lanes; $("#lb").innerHTML = standings(s.players, false); return;
  }
  const q = s.question, mult = (1 + (q.difficulty - 1) / Math.max(1, n - 1)).toFixed(1);
  if (renderedRound !== q.index) {
    renderedRound = q.index;
    const last = s.lastGraded;
    shell({
      hud: `Rung ${q.index + 1} of ${n}`,
      rail: `<div class="rail">${Array.from({ length: n }, (_, k) => `<i class="${k < q.index ? "done" : k === q.index ? "cur" : ""}"></i>`).join("")}</div>`,
      stage: `<div class="panel fill" style="gap:8px">
          ${last ? `<div class="row click" id="lastrow"><span class="rk">${last.points > 0 ? "✓" : "✗"}</span><span class="nm">Previous rung: +${last.points}<small>${Math.round((last.coverage || 0) * 100)}% covered. Tap for the rubric.</small></span><span class="pt">+${last.points}</span></div>` : ""}
          <div class="qhead"><span class="rung">${esc(q.label).toUpperCase()}</span><span class="mult">×${mult} points</span></div>
          <p class="q">${esc(q.prompt)}</p>
          <textarea id="ans" placeholder="Explain in your own words. Faster answers score more."></textarea>
          <div id="track">${lanes}</div>
        </div>`,
      side: `<div class="panel fill"><div class="qhead"><h2>Standings</h2></div><div class="list" id="lb">${standings(s.players, false)}</div></div>`,
      dock: `<span class="note">Graded instantly</span><button class="btn" id="submit">Lock in</button>`,
    });
    if (last) $("#lastrow").onclick = () => openSheet(`Previous rung: +${last.points}`, `<p class="small muted" style="margin-bottom:8px">${esc(last.prompt)}</p>` + answerDetail(last, last.rubric, last.points_ref));
    const ta = $("#ans");
    ta.oninput = () => { const t = Date.now(); if (t - lastTyping > 1800) { lastTyping = t; post("typing", { ...session, q: q.index }).catch(() => {}); } };
    ta.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") submit(); });
    $("#submit").onclick = submit;
    async function submit() {
      const text = ta.value.trim(); if (text.length < 5) { toast("Write a bit more first", true); return; }
      $("#submit").disabled = true; $("#submit").textContent = "Grading";
      try { const r = await post("answer", { ...session, q: q.index, text }); r.graded.points > 0 ? snd.lock() : snd.thud(); toast(`+${r.graded.points} points`); await poll(); }
      catch (e) { toast(e.message, true); $("#submit").disabled = false; $("#submit").textContent = "Lock in"; }
    }
    setTimeout(() => ta.focus(), 30);
  } else { $("#track").innerHTML = lanes; if ($("#lb")) $("#lb").innerHTML = standings(s.players, false); }
}

// ---- finished ----
function renderFinished() {
  const s = state;
  if (renderedRound === 777) return;
  renderedRound = 777;
  const top = s.players.slice(0, 3), me = s.players.find((p) => p.isMe);
  const pod = (p, cls, place) => p ? `<div class="pod ${cls}"><span class="place">${place}</span>${av(p, cls === "p1" ? "lg" : "")}<span class="nm">${esc(p.name)}</span><span class="sc">${p.score}</span></div>` : `<div class="pod ${cls}" style="opacity:.3"><span class="place">${place}</span></div>`;
  shell({
    hud: esc(s.topic),
    stage: `<div class="panel fill" style="gap:10px">
      <div class="center"><h2>${top[0] ? `${esc(top[0].name)} wins` : "Game over"}</h2><p class="muted small">${me ? `You finished ${me.rank === 1 ? "first" : "#" + me.rank} with ${me.score} points.` : ""}</p></div>
      <div class="podium">${pod(top[1], "p2", "2nd")}${pod(top[0], "p1", "1st")}${pod(top[2], "p3", "3rd")}</div>
      <div class="list" id="lb">${standings(s.players, false)}</div>
      <div class="err" id="ferr"></div>
    </div>`,
    dock: `<button class="btn ghost" id="review">Review rungs</button><span class="note">${s.isHost ? "" : "Host can start a rematch"}</span>${s.isHost ? `<button class="btn" id="again">Play again</button>` : ""}`,
  });
  snd.win(); confetti();
  $("#review").onclick = () => reviewSheet(0);
  if ($("#again")) $("#again").onclick = () => {
    openSheet("Play again", `<label>Topic</label><input type="text" id="again-topic" value="${esc(s.topic)}" maxlength="120"><p class="small muted" style="margin-top:8px">Same players, scores reset, a fresh ladder.</p><div class="err" id="aerr"></div>`, `<button class="btn wide" id="again-go">Start a new ladder</button>`);
    $("#again-go").onclick = () => { $("#again-go").disabled = true; post("again", { ...session, topic: $("#again-topic").value }).then(() => { lastRanks = {}; closeSheet(); poll(); }).catch((e) => { $("#aerr").textContent = e.message; $("#again-go").disabled = false; }); };
  };
  function reviewSheet(i) {
    const r = s.summary[i];
    openSheet(`Rung ${i + 1} of ${s.summary.length}`, `<p class="small muted" style="margin-bottom:8px">${esc(r.label)}</p><p style="font:700 18px 'Barlow Semi Condensed', system-ui, sans-serif;margin-bottom:10px">${esc(r.prompt)}</p><div class="list" id="rv">${r.answers.map((a, k) => answerRow(a, k)).join("")}</div>`,
      `<button class="btn ghost" id="rv-prev" ${i === 0 ? "disabled" : ""}>Previous</button><span style="flex:1"></span><button class="btn ghost" id="rv-next" ${i >= s.summary.length - 1 ? "disabled" : ""}>Next</button>`);
    $("#rv-prev").onclick = () => reviewSheet(i - 1); $("#rv-next").onclick = () => reviewSheet(i + 1);
    $("#rv").querySelectorAll("[data-ans]").forEach((row) => row.onclick = () => { const a = r.answers[Number(row.dataset.ans)]; openSheet(`${a.name}: ${a.skipped ? "0" : "+" + a.points}`, answerDetail(a, r.rubric, r.points), `<button class="btn ghost wide" id="back">Back to rung ${i + 1}</button>`); $("#back").onclick = () => reviewSheet(i); });
  }
}
function confetti() {
  const c = $("#confetti"); c.innerHTML = "";
  const colors = ["#F7B32B", "#3D7BFF", "#2ED28A", "#FF4D5E", "#B36BFF"];
  for (let i = 0; i < 70; i++) { const el = document.createElement("i"); el.style.left = Math.random() * 100 + "vw"; el.style.background = colors[i % colors.length]; el.style.animationDuration = 2.5 + Math.random() * 2 + "s"; el.style.animationDelay = Math.random() * 1.2 + "s"; c.appendChild(el); }
  setTimeout(() => (c.innerHTML = ""), 6000);
}

// ============ boot ============
if (session) startPolling(); else renderHome();
</script>
</body>
</html>
